<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }

        .container {
            text-align: center;
            animation: fadeIn 0.3s ease-out;
        }

        .checkmark {
            font-size: 4rem;
            animation: scaleIn 0.3s ease-out;
        }

        h1 {
            font-size: 2rem;
            margin-top: 1rem;
            font-weight: 600;
        }

        p {
            font-size: 1rem;
            margin-top: 0.5rem;
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>Saved!</h1>
        <p>Closing...</p>
    </div>

    <script>
        // Try multiple methods to close/dismiss this page

        // Method 1: Close window immediately
        setTimeout(() => {
            window.close();
        }, 500);

        // Method 2: Go back in history
        setTimeout(() => {
            if (window.history.length > 1) {
                window.history.back();
            }
        }, 600);

        // Method 3: Navigate to about:blank as last resort
        setTimeout(() => {
            window.location.href = 'about:blank';
        }, 700);

        // Method 4: For PWA, try to minimize
        setTimeout(() => {
            if (window.matchMedia('(display-mode: standalone)').matches) {
                // Running as PWA
                window.close();
            }
        }, 800);
    </script>
</body>

</html>
