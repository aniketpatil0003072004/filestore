<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Test - Video Vault</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0f172a;
            color: white;
        }

        .test-item {
            background: #1e293b;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #6366f1;
        }

        .success {
            border-left-color: #10b981;
        }

        .error {
            border-left-color: #ef4444;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
        }

        pre {
            background: #000;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <h1>🔧 Video Vault PWA Diagnostics</h1>

    <div id="results"></div>

    <button onclick="runTests()">Run Tests</button>
    <button onclick="testShareTarget()">Test Share Target</button>
    <button onclick="window.location.href='/'">Go to App</button>

    <script>
        async function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Running Tests...</h2>';

            let html = '';

            // Test 1: Service Worker
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.getRegistration();
                    if (registration) {
                        html += `<div class="test-item success">✅ Service Worker: Registered</div>`;
                    } else {
                        html += `<div class="test-item error">❌ Service Worker: Not registered</div>`;
                    }
                } catch (e) {
                    html += `<div class="test-item error">❌ Service Worker: Error - ${e.message}</div>`;
                }
            } else {
                html += `<div class="test-item error">❌ Service Worker: Not supported</div>`;
            }

            // Test 2: Manifest
            try {
                const response = await fetch('/manifest.json');
                const manifest = await response.json();
                html += `<div class="test-item success">✅ Manifest: Loaded successfully</div>`;
                html += `<div class="test-item"><strong>Manifest Details:</strong><pre>${JSON.stringify(manifest, null, 2)}</pre></div>`;

                if (manifest.share_target) {
                    html += `<div class="test-item success">✅ Share Target: Configured</div>`;
                } else {
                    html += `<div class="test-item error">❌ Share Target: Not configured</div>`;
                }
            } catch (e) {
                html += `<div class="test-item error">❌ Manifest: Failed to load - ${e.message}</div>`;
            }

            // Test 3: HTTPS
            if (window.location.protocol === 'https:' || window.location.hostname === 'localhost') {
                html += `<div class="test-item success">✅ HTTPS: Enabled</div>`;
            } else {
                html += `<div class="test-item error">❌ HTTPS: Not enabled (required for PWA)</div>`;
            }

            // Test 4: Display Mode
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
            if (isStandalone) {
                html += `<div class="test-item success">✅ Display Mode: Installed (Standalone)</div>`;
            } else {
                html += `<div class="test-item">ℹ️ Display Mode: Browser (Not installed yet)</div>`;
            }

            // Test 5: URL Parameters (for share target)
            const urlParams = new URLSearchParams(window.location.search);
            const sharedUrl = urlParams.get('url') || urlParams.get('text');
            if (sharedUrl) {
                html += `<div class="test-item success">✅ Share Target: Received URL - ${sharedUrl}</div>`;
            } else {
                html += `<div class="test-item">ℹ️ Share Target: No shared URL detected</div>`;
            }

            results.innerHTML = html;
        }

        function testShareTarget() {
            // Simulate share target by adding URL params
            const testUrl = 'https://youtube.com/watch?v=test123';
            window.location.href = `/?url=${encodeURIComponent(testUrl)}&title=Test Video`;
        }

        // Auto-run tests on load
        window.addEventListener('load', runTests);
    </script>
</body>

</html>
